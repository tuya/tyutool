name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Extract version + sync to branch ────────────────────────────────────────
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    # GitHub's default job timeout is 6 HOURS. CI hit that reality on
    # 2026-08-18 when an apt mirror stalled and a 2-minute job idled for 43
    # minutes before a human cancelled it. A release runs unattended after a
    # tag push, so a stuck job here is even easier to miss. Every cap below is
    # ~3-4x the slowest of the last six releases (recorded per job), which is
    # far enough above a cold-cache build to never fire on a healthy run and
    # far enough below 6 hours to matter.
    #   Prepare: 0.1 min
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.v.outputs.version }}
      is_beta: ${{ steps.v.outputs.is_beta }}
      file_label: ${{ steps.v.outputs.file_label }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: v
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VER="${{ github.ref_name }}"
            VER="${VER#v}"
            echo "is_beta=false" >> "$GITHUB_OUTPUT"
            echo "file_label=${VER}" >> "$GITHUB_OUTPUT"
          else
            VER="beta"
            echo "is_beta=true" >> "$GITHUB_OUTPUT"
          fi
          node scripts/bump-version.mjs "$VER"
          RESOLVED=$(jq -r .version package.json)
          echo "version=${RESOLVED}" >> "$GITHUB_OUTPUT"
          # For beta: file names use "version.beta" to distinguish from release
          if [[ "$VER" == "beta" ]]; then
            echo "file_label=${RESOLVED}.beta" >> "$GITHUB_OUTPUT"
          fi

  # ── Frontend build (platform-independent, built once and shared) ─────────────
  # vue-tsc + vite build → dist/; uploaded as artifact for all build-gui jobs.
  # beforeBuildCommand in tauri.conf.json is cleared so tauri CLI does not
  # re-run this automatically inside each build-gui job.
  build-frontend:
    name: Frontend (build)
    needs: [prepare]
    runs-on: ubuntu-latest
    # Slowest of the last six releases: 0.6 min.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Sync version
        run: node scripts/bump-version.mjs "${{ needs.prepare.outputs.version }}"

      - uses: pnpm/action-setup@v5
        with: { version: 10 }
      - uses: actions/setup-node@v6
        with: { node-version: "22", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  # ── CLI (5 platforms) ────────────────────────────────────────────────────────
  # Pure Rust binary, musl static linking (Linux), no Tauri / Node dependency
  # Artifacts: tyutool-cli_{platform}_{arch}_{ver}.tar.gz / .zip
  build-cli:
    name: CLI · ${{ matrix.platform }}-${{ matrix.arch }}
    needs: [prepare]
    runs-on: ${{ matrix.os }}
    # Slowest of the last six releases: 7.4 min (windows-x86_64).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,   target: x86_64-unknown-linux-musl,  platform: linux,   arch: x86_64,  use_cross: false }
          - { os: ubuntu-22.04,   target: aarch64-unknown-linux-musl, platform: linux,   arch: aarch64, use_cross: true  }
          - { os: macos-15-intel, target: x86_64-apple-darwin,        platform: macos,   arch: x86_64,  use_cross: false }
          - { os: macos-latest,   target: aarch64-apple-darwin,       platform: macos,   arch: aarch64, use_cross: false }
          - { os: windows-2022,   target: x86_64-pc-windows-msvc,     platform: windows, arch: x86_64,  use_cross: false }
    steps:
      - uses: actions/checkout@v7

      - name: Sync version
        run: node scripts/bump-version.mjs "${{ needs.prepare.outputs.version }}"

      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
        with: { key: "cli-${{ matrix.target }}" }

      - name: Install cross
        if: matrix.use_cross
        run: |
          CROSS_VERSION="v0.2.5"
          curl -fsSL "https://github.com/cross-rs/cross/releases/download/${CROSS_VERSION}/cross-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz -C "$HOME/.cargo/bin"
          cross --version

      - name: Install musl-tools
        if: runner.os == 'Linux' && !matrix.use_cross
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: ${{ matrix.use_cross && 'cross' || 'cargo' }} build --release -p tyutool-cli --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          V="${{ needs.prepare.outputs.file_label }}"
          mkdir -p dist
          tar -czf "dist/tyutool-cli_${{ matrix.platform }}_${{ matrix.arch }}_${V}.tar.gz" \
              -C "target/${{ matrix.target }}/release" tyutool_cli

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $V = "${{ needs.prepare.outputs.file_label }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "target/${{ matrix.target }}/release/tyutool_cli.exe" `
            -DestinationPath "dist/tyutool-cli_${{ matrix.platform }}_${{ matrix.arch }}_${V}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: tyutool-cli_${{ matrix.platform }}_${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  # ── GUI (7 installers + 4 portables) ────────────────────────────────────────
  # Tauri 2 desktop app. One job per platform/arch; a single compile emits every
  # bundle format for that target (Linux deb+appimage+rpm share one build).
  # Binary name = tyutool_gui (set by src-tauri/Cargo.toml [package].name)
  # Artifacts: tyutool-gui_{platform}_{arch}_{type}_{ver}.ext
  build-gui:
    name: GUI · ${{ matrix.platform }}-${{ matrix.arch }} · ${{ matrix.install_type }}
    needs: [prepare, build-frontend]
    runs-on: ${{ matrix.os }}
    # Slowest of the last six releases: 11.7 min (macos-universal). The cap is
    # deliberately loose here: notarization waits on Apple, which is outside our
    # control and occasionally slow, and a false timeout on release day costs a
    # full matrix re-run.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 — all bundle formats produced from a single compile
          - { os: ubuntu-22.04,     target: x86_64-unknown-linux-gnu,  platform: linux,   arch: x86_64,   bundles: "deb,appimage,rpm", install_types: "deb appimage rpm", install_type: installers, with_portable: true }
          # Linux aarch64 (native ARM runner — no cross-compilation needed)
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, platform: linux,   arch: aarch64,  bundles: "deb,appimage",     install_types: "deb appimage",     install_type: installers, with_portable: true }
          # macOS Universal Binary (single build covers Intel + Apple Silicon)
          # bundle_prefix: Tauri places universal artifacts under target/universal-apple-darwin/release/
          # tauri_args:    passed verbatim to `npx @tauri-apps/cli build`
          - { os: macos-latest, target: universal-apple-darwin, platform: macos, arch: universal, bundles: "dmg,app", install_types: "dmg", install_type: dmg, with_portable: true, with_updater: true, bundle_prefix: "target/universal-apple-darwin/release", tauri_args: "--target universal-apple-darwin" }
          # Windows x86_64 — NSIS installer + portable (MSI removed; NSIS is simpler and matches sftool-gui)
          - { os: windows-2022,     target: x86_64-pc-windows-msvc,    platform: windows, arch: x86_64,   bundles: nsis,      install_type: nsis,     with_portable: true  }
    env:
      PREFIX: tyutool-gui_${{ matrix.platform }}_${{ matrix.arch }}
      VERSION: ${{ needs.prepare.outputs.file_label }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # ── macOS 代码签名与公证 ────────────────────────────────────────────────
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Sync version
        run: node scripts/bump-version.mjs "${{ needs.prepare.outputs.version }}"

      # ── System dependencies ──
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev libudev-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            xdg-utils

      # ── Toolchain ──
      - uses: pnpm/action-setup@v5
        with: { version: 10 }
      - uses: actions/setup-node@v6
        with: { node-version: "22", cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          # universal-apple-darwin is not a real Rust target; install both arches instead.
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          # shared-key replaces the per-job key suffix so a target's cache is reusable
          # across runs; each target now compiles in a single job, so always persist it.
          shared-key: "gui-${{ matrix.target }}"
          save-if: true

      # ── Frontend dist (pre-built, platform-independent) ──
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: dist/

      # ── Tauri build ──
      # ── Import Apple signing certificate into a temporary keychain ─────────
      - name: Import Apple signing certificate
        if: runner.os == 'macOS'
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASS="$(uuidgen)"

          # 解码 Base64 证书，创建临时 Keychain 并导入
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S "apple-tool:,apple:,codesign:" \
            -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

          # 将临时 Keychain 加入搜索列表
          security list-keychains -d user \
            -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          # 从证书中动态读取 Signing Identity，写入后续步骤可用的环境变量
          SIGNING_IDENTITY=$(
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" \
            | awk -F'"' '{print $2}' \
            | head -1
          )
          echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"

          # 删除临时 .p12 文件
          rm -f "$RUNNER_TEMP/certificate.p12"
          
      - run: pnpm install --frozen-lockfile
      - name: Build Tauri app
        shell: bash
        # tauri_args is set in the matrix (e.g. "--target universal-apple-darwin"); empty for other platforms.
        run: npx @tauri-apps/cli build --bundles "${{ matrix.bundles }}" ${{ matrix.tauri_args }} --ci

      # ── Installer: locate Tauri output and rename uniformly ──
      # Use release-pkg/ instead of dist/ to avoid collision with Vite build output.
      # bundle_prefix is set in the matrix for non-default layouts (e.g. universal-apple-darwin).
      # A single Tauri compile can emit several bundle formats (e.g. deb+appimage+rpm
      # on Linux), so loop over each one in matrix.install_types and rename uniformly.
      - name: Package installer (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p release-pkg
          BUNDLE_BASE="${{ matrix.bundle_prefix || 'target/release' }}"
          for IT in ${{ matrix.install_types }}; do
            BUNDLE_DIR="${BUNDLE_BASE}/bundle/${IT}"
            case "$IT" in
              deb)      GLOB="*.deb" ;;
              rpm)      GLOB="*.rpm" ;;
              appimage) GLOB="*.AppImage" ;;
              dmg)      GLOB="*.dmg" ;;
              *)        GLOB="*" ;;
            esac
            SRC=$(find "$BUNDLE_DIR" -maxdepth 1 -name "$GLOB" -type f | head -1)
            if [ -z "$SRC" ]; then
              echo "::error::No ${IT} bundle found in ${BUNDLE_DIR}"
              exit 1
            fi
            EXT="${SRC##*.}"
            DEST="${PREFIX}_${IT}_${VERSION}.${EXT}"
            cp "$SRC" "release-pkg/${DEST}"
            # Copy .sig file if it exists (needed by generate-manifest.ts for GUI updater)
            SIG="${SRC}.sig"
            if [ -f "$SIG" ]; then
              cp "$SIG" "release-pkg/${DEST}.sig"
            fi
          done

      - name: Package installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-pkg | Out-Null
          $src = Get-ChildItem "target/release/bundle/${{ matrix.install_type }}" -File |
            Where-Object { $_.Extension -ne '.sig' } | Select-Object -First 1
          $dest = "${env:PREFIX}_${{ matrix.install_type }}_${env:VERSION}$($src.Extension)"
          Copy-Item $src.FullName "release-pkg/$dest"
          # Copy .sig file if it exists
          $sig = "$($src.FullName).sig"
          if (Test-Path $sig) {
            Copy-Item $sig "release-pkg/$dest.sig"
          }

      # ── Updater artifact (macOS .app.tar.gz + .sig) ──
      # Tauri updater on macOS uses .app.tar.gz (not .dmg).
      # For universal builds the tarball is under target/universal-apple-darwin/release/bundle/macos/.
      - name: Package updater artifact (macOS)
        if: matrix.with_updater && runner.os == 'macOS'
        run: |
          mkdir -p release-pkg
          BUNDLE_BASE="${{ matrix.bundle_prefix || 'target/release' }}"
          UPDATER_DIR="${BUNDLE_BASE}/bundle/macos"
          UPDATER_SRC=$(find "$UPDATER_DIR" -maxdepth 1 -name "*.app.tar.gz" -type f | head -1)
          if [ -n "$UPDATER_SRC" ]; then
            UPDATER_DEST="${PREFIX}_update_${VERSION}.app.tar.gz"
            cp "$UPDATER_SRC" "release-pkg/${UPDATER_DEST}"
            UPDATER_SIG="${UPDATER_SRC}.sig"
            if [ -f "$UPDATER_SIG" ]; then
              cp "$UPDATER_SIG" "release-pkg/${UPDATER_DEST}.sig"
            fi
          fi

      # Also upload the .sig file alongside the installer so generate-manifest.ts
      # can read the signature for the Tauri updater platforms field.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PREFIX }}_${{ matrix.install_type }}
          path: release-pkg/
          if-no-files-found: error

      # ── Portable ──
      # Binary name is determined by src-tauri/Cargo.toml [package].name = tyutool_gui
      - name: Package portable (Unix)
        if: matrix.with_portable && runner.os != 'Windows'
        run: |
          mkdir -p release-portable
          BUNDLE_BASE="${{ matrix.bundle_prefix || 'target/release' }}"
          tar -czf "release-portable/${PREFIX}_portable_${VERSION}.tar.gz" \
              -C "${BUNDLE_BASE}" tyutool_gui

      - name: Package portable (Windows)
        if: matrix.with_portable && runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-portable | Out-Null
          Compress-Archive -Path "target/release/tyutool_gui.exe" `
            -DestinationPath "release-portable/${env:PREFIX}_portable_${env:VERSION}.zip"

      - uses: actions/upload-artifact@v7
        if: matrix.with_portable
        with:
          name: ${{ env.PREFIX }}_portable
          path: release-portable/
          if-no-files-found: error

  # ── GitHub Release + latest.json manifest (tag trigger only) ────────────────
  create-release:
    name: Create Release + manifest
    needs: [prepare, build-cli, build-gui]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    # Slowest of the last six releases: 0.8 min, but this job uploads every
    # asset to GitHub, so the cap allows for a bad network day.
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5
        with: { version: 10 }
      - uses: actions/setup-node@v6
        with: { node-version: "22", cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Extract release body from CHANGELOG
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: pnpm exec tsx scripts/changelog-section.ts

      - uses: actions/download-artifact@v8
        with:
          path: artifacts/
          pattern: "tyutool-*"
          merge-multiple: false

      - run: find artifacts/ -type f | sort

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          find artifacts/ -type f -exec cp {} release-assets/ \;
          echo "── Release assets ──────────────────────────────"
          ls -lh release-assets/

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: tyutool ${{ github.ref_name }}
          draft: true
          body_path: release-body.md
          files: release-assets/*

      - name: Capture release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          BODY="$(gh release view "$TAG" --repo "${{ github.repository }}" --json body -q .body)"
          {
            echo "body<<__TYUTOOL_NOTES_EOF__"
            echo "$BODY"
            echo "__TYUTOOL_NOTES_EOF__"
          } >> "$GITHUB_OUTPUT"

      # ── latest.json update manifest ──
      # Generated in this same job: artifacts/ is already downloaded and the draft
      # release exists, so no second runner / artifact download / pnpm install is needed.
      - name: Generate manifest
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GITHUB_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          RELEASE_NOTES: ${{ steps.notes.outputs.body }}
        run: pnpm exec tsx scripts/generate-manifest.ts

      # latest.json: url → GitHub. release.json: mainland-China variant (url → Tuya OSS);
      # the external tuyaopen-oss-publish pipeline copies it to .../tyutool/latest/release.json.
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            latest.json
            release.json

  # ── Verify draft release, then publish ──────────────────────────────────────
  publish:
    name: Verify & Publish
    needs: [prepare, create-release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    # Slowest of the last six releases: 0.3 min.
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
        with: { version: 10 }
      - uses: actions/setup-node@v6
        with: { node-version: "22", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Verify assets + latest.json, then un-draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: pnpm exec tsx scripts/verify-release.ts
