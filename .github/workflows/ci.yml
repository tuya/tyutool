name: CI

on:
  pull_request:
  push:
    branches: [master, refactor/v3]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Rust core + CLI tests ───────────────────────────────────────────────────
  # tyutool-core and tyutool-cli hold the flash logic and need no GTK/WebKit
  # system dependency, so this job stays fast and gates every push. The Tauri
  # backend needs those libraries and is gated separately in the `tauri` job.
  # `cargo fmt --all` covers every crate including src-tauri.
  rust:
    name: Rust (core + cli)
    runs-on: ubuntu-latest
    # This pipeline finishes in ~2 minutes. GitHub's default job timeout is 6
    # HOURS, so a hung step (see the apt note in `tauri`) burns the runner until
    # a human notices and cancels. Cap every job well above its real cost and
    # far below the default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { key: "ci-rust" }
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy -p tyutool-core -p tyutool-cli --all-targets -- -D warnings
      - name: Test
        run: cargo test -p tyutool-core -p tyutool-cli

  # ── Tauri backend (src-tauri) ───────────────────────────────────────────────
  # Guards the GUI bridge: path-traversal rejection, credential redaction on the
  # log-export path, and window-layout math all live here. Needs the GTK/WebKit
  # dev packages, hence a job of its own. `dist/` is not required — Tauri only
  # verifies frontendDist when bundling, not for cargo check/test.
  tauri:
    name: Rust (tauri backend)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      # This step normally takes 30-60s. On 2026-08-18 it hung for 43 minutes on
      # an unresponsive apt mirror and had to be cancelled by hand, so it is now
      # bounded twice: apt gives up on a stalled connection (Retries/Timeout), and
      # the step itself dies rather than idling all the way into the job cap.
      # `build-essential curl wget file` are dropped from the Tauri-documented
      # list -- the ubuntu runner image already ships them, and every extra
      # package is one more mirror fetch that can stall.
      - name: Install Linux system dependencies
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
          APT_OPTS: -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15
        run: |
          sudo apt-get update -qq $APT_OPTS
          sudo apt-get install -y --no-install-recommends $APT_OPTS \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libxdo-dev libssl-dev libudev-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { key: "ci-tauri" }
      - name: Clippy
        run: cargo clippy -p tyutool_gui --all-targets -- -D warnings
      - name: Test
        run: cargo test -p tyutool_gui

  # ── Frontend lint + tests + type-checked build ──────────────────────────────
  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with: { version: 10 }
      - uses: actions/setup-node@v6
        with: { node-version: "22", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      # `pnpm run build` type-checks src/ only. scripts/ drives releases and was
      # never checked, which is how a 3-arg call to a 2-param function survived
      # there long enough to silently drop the git-cliff changelog body.
      - run: pnpm run typecheck:scripts
      # test:coverage, not test — this is what enforces the thresholds in
      # vitest.config.ts. Plain `pnpm run test` leaves them unchecked.
      - run: pnpm run test:coverage
      - run: pnpm run build
