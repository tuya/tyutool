name: CI

on:
  pull_request:
  push:
    branches: [master, refactor/v3]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Rust core + CLI tests ───────────────────────────────────────────────────
  # tyutool-core, tyutool-cli and tyutool-serve hold the flash logic and the dev
  # WS shim, and need no GTK/WebKit system dependency, so this job stays fast and
  # gates every push. The Tauri backend needs those libraries and is gated
  # separately in the `tauri` job. `cargo fmt --all` covers every crate including
  # src-tauri.
  #
  # tyutool-serve joined here rather than getting a job of its own: it has no extra
  # system deps, and its suite guards `validate_ws_origin` — the cross-origin and
  # DNS-rebinding rejections that stop a random web page from driving the user's
  # hardware. Those 28 tests existed but ran in no CI job at all until 2026-08-27.
  rust:
    name: Rust (core + cli + serve)
    runs-on: ubuntu-latest
    # This pipeline finishes in ~2 minutes. GitHub's default job timeout is 6
    # HOURS, so a hung step (see the apt note in `tauri`) burns the runner until
    # a human notices and cancels. Cap every job well above its real cost and
    # far below the default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { key: "ci-rust" }
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy -p tyutool-core -p tyutool-cli -p tyutool-serve --all-targets -- -D warnings
      - name: Test
        run: cargo test -p tyutool-core -p tyutool-cli -p tyutool-serve
      # tyutool-core declares no default feature, so the run above compiles
      # neither the zip export nor the Excel row allocator — and skips their
      # tests silently. Lint and run them here rather than in the `tauri` job:
      # both are pure Rust and need none of the GTK/WebKit system libraries.
      # `libudev` stays out; it needs a system library this runner lacks.
      - name: Clippy and test tyutool-core's optional features
        run: |
          cargo clippy -p tyutool-core --all-targets --features zip,excel -- -D warnings
          cargo test -p tyutool-core --features zip,excel
      - name: Bindings are up to date
        run: |
          cargo test -p tyutool-core --features ts-rs
          git diff --exit-code -- src/bindings/

  # ── Tauri backend (src-tauri) ───────────────────────────────────────────────
  # Guards the GUI bridge: path-traversal rejection, credential redaction on the
  # log-export path, and window-layout math all live here. Needs the GTK/WebKit
  # dev packages, hence a job of its own. `dist/` is not required — Tauri only
  # verifies frontendDist when bundling, not for cargo check/test.
  tauri:
    name: Rust (tauri backend)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # This step normally takes 30-60s for ~60 MB of archives. Twice on
      # 2026-08-18 the azure mirror crawled instead: once for 43 minutes (the
      # job had to be cancelled by hand) and once at ~0.1 MB/s, stalling three
      # minutes inside a single .deb. `Acquire::*::Timeout` does not catch that
      # -- the connection is alive, just glacial -- so each attempt is bounded
      # by `timeout` and retried. Retries resume: apt keeps the .debs it already
      # fetched in /var/cache/apt/archives, so three bad windows still add up to
      # a complete download rather than three fresh starts.
      # `build-essential curl wget file` are dropped from the Tauri-documented
      # list -- the ubuntu runner image already ships them.
      - name: Install Linux system dependencies
        timeout-minutes: 14
        env:
          DEBIAN_FRONTEND: noninteractive
          APT_OPTS: -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15
        run: |
          sudo apt-get update -qq $APT_OPTS
          for attempt in 1 2 3; do
            if sudo timeout 240 apt-get install -y --no-install-recommends $APT_OPTS \
                 libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
                 libxdo-dev libssl-dev libudev-dev \
                 libayatana-appindicator3-dev librsvg2-dev patchelf; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt did not finish in 240s; retrying"
            # If the kill landed mid-unpack, dpkg refuses to do anything else
            # until it is told to finish the interrupted transaction.
            sudo dpkg --configure -a || true
            sleep 10
          done
          echo "::error::apt could not install the Tauri dependencies in 3 attempts"
          exit 1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { key: "ci-tauri" }
      - name: Clippy
        run: cargo clippy -p tyutool_gui --all-targets -- -D warnings
      - name: Test
        run: cargo test -p tyutool_gui

  # ── Frontend lint + tests + type-checked build ──────────────────────────────
  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      # `pnpm run build` type-checks src/ only. scripts/ drives releases and was
      # never checked, which is how a 3-arg call to a 2-param function survived
      # there long enough to silently drop the git-cliff changelog body.
      - run: pnpm run typecheck:scripts
      # test:coverage, not test — this is what enforces the thresholds in
      # vitest.config.ts. Plain `pnpm run test` leaves them unchecked.
      - run: pnpm run test:coverage
      - run: pnpm run build
