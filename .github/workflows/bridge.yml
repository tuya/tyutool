# ════════════════════════════════════════════════════════════════════════════
#  Bridge — CI + release for the `tyutool-bridge` crate
# ════════════════════════════════════════════════════════════════════════════
#
#  ── Why this is a separate file ────────────────────────────────────────────
#  `tyutool-bridge` is a fork-only crate (resident local WebSocket flash helper
#  + system tray). Upstream `ci.yml` / `release.yml` know nothing about it, and
#  we deliberately keep it that way: EVERYTHING bridge-related lives in this one
#  file, so merging the fork back into upstream is a whole-file accept/reject
#  decision with zero hunk conflicts.
#
#  DO NOT move bridge steps into `ci.yml` or `release.yml`. If you need a new
#  bridge job, add it here.
#
#  The tag namespace is also deliberately disjoint:
#      upstream releases → `v*.*.*`      (release.yml)
#      bridge releases   → `bridge-v*`   (this file)
#  Neither side's tags can trigger the other side's pipeline.
#
#  ── 签名：有证书就签，没有就照常出未签名包 ─────────────────────────────────
#  macOS 签名与公证走**与 release.yml 相同的 secrets**（APPLE_CERTIFICATE /
#  APPLE_CERTIFICATE_PASSWORD / APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID）。
#  bridge 是同一个产品的另一个可执行文件，用同一张 Developer ID 证书签是对的，
#  上游也不必再维护第二套凭据。
#
#  开关是**自动**的，不需要为 fork 和上游各留一套配置：
#    · 有 APPLE_CERTIFICATE  → 构建前把 `signing_identity` 写进 Cargo.toml
#                              → cargo-packager 签名并公证；
#    · 没有（fork 的常态）    → 不写那一行 → cargo-packager 整段跳过签名（不报错），
#                              产出未签名包，与本次改动前的行为完全一致。
#  实现细节与「为什么不能用 --config 注入」的查证记录，见下方 build job 里
#  「Enable macOS signing」那一步的注释。
#
#  ⚠ 未签名包（fork 构建、或上游 secret 未配时）的后果：
#    • macOS   — Gatekeeper 拦截。用户需右键 → 打开，或执行：
#                    xattr -d com.apple.quarantine ./tyutool-bridge
#    • Windows — SmartScreen 提示「Windows 已保护你的电脑」，需点「更多信息」→
#                「仍要运行」。**Windows 侧本工作流目前不做签名**，与 release.yml
#                一致（那边也只有 Apple + Tauri updater，没有 signtool）。
#                要加 Windows 签名需要另外的证书与 secret，届时在这里补。
#    • Linux   — 不受影响（无系统级签名门）。
#
#  ⚠ **绝不要把签名凭据放进 fork 的 secrets**：fork 的 secret 对任何能改本文件的人
#  都是可读的（改一行 workflow 就能把它 echo 出来）。签名只应在上游仓库发生。
#
#  ── TODO: macOS `.app` bundle? ─────────────────────────────────────────────
#  This workflow ships a BARE BINARY (tar.gz), not a `.app` bundle. Verified
#  locally: the bare binary does run the menu-bar tray on macOS. What a bundle
#  would additionally buy us:
#    • `LSUIElement = true` in Info.plist → no Dock icon and no app-switcher
#      entry. A bare binary is an unbundled process, so macOS always gives it a
#      Dock tile — cosmetically wrong for a background helper.
#    • A stable bundle identifier, which is what `codesign` / `notarytool` and
#      LaunchAgent-based autostart really want.
#  Decision for now: bare binary is enough for integration testing, and a
#  bundle without a signing identity would still be Gatekeeper-blocked, so it
#  buys little until signing exists.
#  ⚠ 这条 TODO 的前提**已经变了**（签名已接上，见文件开头）：dmg 里的 `.app` 现在
#  会被签名与公证，所以「没有身份、签了也白签」这条理由不再成立。剩下的取舍只是
#  bare binary（tar.gz，给 CI/守护进程用）要不要继续与 dmg 并行发——两者本就并行，
#  真正待办是**给 bare binary 也补 LSUIElement**，那需要它自己成为 .app。
#
#  ── TODO: Windows console window ───────────────────────────────────────────
#  `crates/tyutool-bridge/src/main.rs` has no `#![windows_subsystem = "windows"]`,
#  so on Windows the tray binary also opens a console window. Same bucket as the
#  `.app` question: a packaging-polish item, not a CI item. Noted here so it is
#  not lost.
# ════════════════════════════════════════════════════════════════════════════

name: Bridge

on:
  push:
    tags: ["bridge-v*"] # disjoint from upstream's `v*.*.*`
    branches: [bridge/main] # fork-only branch; never exists upstream, so inert there
  # ⚠ PR 触发按 paths 收窄——但**它真正影响的只有 `check` 这一个 job**，别把功劳记错
  # （二次 CR 更正）：`prepare` 自带 `if: tag 或 workflow_dispatch`，而 `build` / `release`
  # 都 `needs: [prepare]`，依赖被跳过时 `success()` 为假，所以三平台构建**在 PR 上本来就
  # 不会跑**。裸 `pull_request:` 的实际代价是每个无关 PR 上多跑一次 `check`（clippy +
  # 单测，单机几分钟），不是三平台打包。
  #
  # 那为什么还要留 PR 触发？因为上游 `ci.yml` 只编译/测试 `tyutool-core` 与 `tyutool-cli`
  # ——**不含本 crate**。删掉 PR 触发，bridge 就完全没有合并前验证了。按 path 收窄既保住
  # 这道网，又对无关 PR 隐形。（把本 crate 加进 `ci.yml` 是另一条路，但那要改上游拥有的
  # 文件；本特性刻意收在这一个文件里——见文件开头。）
  #
  # ⚠ 由此派生一条**验证纪律**：新增签名逻辑无法靠开 PR 或往 bridge/main 推普通提交来验，
  # 那两种事件都到不了 `build`。只能用 workflow_dispatch，或真打一个 bridge-v* tag。
  pull_request:
    paths:
      - "crates/tyutool-bridge/**"
      - "crates/tyutool-core/**" # the bridge links it; a core change can break us
      - ".github/workflows/bridge.yml"
      # ⚠ workspace 级的两份清单也要算进来（二次 CR）：
      #   · .cargo/config.toml 供着 Windows MSVC 的 +crt-static，且 bridge 自己的
      #     tests/build_config.rs 就是守它的——它不在 crates/ 下，漏了就等于守卫失效；
      #   · 根 Cargo.toml 改 [workspace] 成员/resolver 会静默改变本 crate 的解析结果。
      - ".cargo/**"
      - "Cargo.toml"
      # 粗了一点：core/cli 的依赖变动也会顺带触发本流水线。精确区分成本高、收益低，接受。
      - "Cargo.lock"
  workflow_dispatch:

concurrency:
  group: bridge-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Clippy + tests, bridge crate only ──────────────────────────────────────
  # Scoped with `-p tyutool-bridge` on purpose: core/cli are already covered by
  # `ci.yml`, and so is `cargo fmt --all` (which formats the bridge sources too).
  # Nothing here duplicates that job.
  check:
    name: Bridge (clippy + test)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      # Same dependency set as the Linux build below — clippy/test have to
      # link the tray stack too. See the build job for the per-package rationale.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libudev-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { key: "bridge-check" }

      - name: Clippy
        run: cargo clippy -p tyutool-bridge --all-targets -- -D warnings

      - name: Test
        run: cargo test -p tyutool-bridge

  # ── Version extraction ─────────────────────────────────────────────────────
  # Mirrors release.yml's `prepare` job, minus `scripts/bump-version.mjs`: that
  # script rewrites package.json / src-tauri versions for the upstream `v*.*.*`
  # line, which has nothing to do with `bridge-v*` and would dirty files this
  # workflow must not touch.
  #   bridge-v1.0.3 → 1.0.3
  #   anything else → <Cargo.toml version>-dev.<short sha>
  prepare:
    name: Prepare
    if: startsWith(github.ref, 'refs/tags/bridge-v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      file_label: ${{ steps.v.outputs.file_label }}
      is_tag: ${{ steps.v.outputs.is_tag }}
    steps:
      - uses: actions/checkout@v6

      - id: v
        run: |
          set -euo pipefail
          if [[ "${{ github.ref }}" == refs/tags/bridge-v* ]]; then
            VER="${{ github.ref_name }}"
            VER="${VER#bridge-v}"
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          else
            CRATE_VER=$(grep -m1 '^version' crates/tyutool-bridge/Cargo.toml | cut -d'"' -f2)
            VER="${CRATE_VER}-dev.$(git rev-parse --short HEAD)"
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          fi
          echo "file_label=${VER}" >> "$GITHUB_OUTPUT"
          echo "Bridge version label: ${VER}"

  # ── Build (3 platforms) ────────────────────────────────────────────────────
  # Artifacts follow release.yml's CLI naming style:
  #   tyutool-bridge_{platform}_{arch}_{ver}.tar.gz   (Linux / macOS)
  #   tyutool-bridge_{platform}_{arch}_{ver}.zip      (Windows)
  # Binary file name is `tyutool-bridge` (from [[bin]] name in Cargo.toml) —
  # note the dash, unlike the CLI's underscored `tyutool_cli`.
  build:
    name: Bridge · ${{ matrix.platform }}-${{ matrix.arch }}
    needs: [prepare]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS universal: `universal-apple-darwin` is not a real rustc target
          # (release.yml only gets away with the name because Tauri synthesises
          # it). For a plain cargo build we compile both arches and `lipo` them.
          - os: macos-latest
            platform: macos
            arch: universal
            targets: "aarch64-apple-darwin x86_64-apple-darwin"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          # Linux: GNU, NOT musl. release.yml's CLI can use musl because it is
          # pure Rust; the bridge links GTK/appindicator for its tray, and those
          # do not static-link under musl.
          # ubuntu-22.04 (not -latest) for the older glibc → wider compatibility.
          - os: ubuntu-22.04
            platform: linux
            arch: x86_64
            targets: "x86_64-unknown-linux-gnu"
            rust_targets: "x86_64-unknown-linux-gnu"
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            platform: windows
            arch: x86_64
            targets: "x86_64-pc-windows-msvc"
            rust_targets: "x86_64-pc-windows-msvc"
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v6

      # Deliberately much shorter than release.yml's Tauri dependency list:
      #   libgtk-3-dev                  → tao (event loop) + muda (menus)
      #   libayatana-appindicator3-dev  → tray-icon (the menu-bar/status icon)
      #   libxdo-dev                    → required by tray-icon / muda
      #   libudev-dev                   → serial port enumeration
      # NOT installed: libwebkit2gtk / libjavascriptcoregtk / librsvg2 /
      # patchelf — those are Tauri's WebView + bundler needs. The bridge has no
      # WebView.
      #
      # Note: tyutool-core declares serialport with `default-features = false`
      # and gates libudev behind an opt-in `libudev` feature that only src-tauri
      # enables — so today's bridge build would link without libudev-dev too.
      # It is kept as cheap insurance: the moment the bridge wants proper USB
      # port metadata on Linux it will need that feature, and a missing -dev
      # package is a confusing link error to debug in CI.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libudev-dev

      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.rust_targets }}" }
      - uses: Swatinem/rust-cache@v2
        with: { key: "bridge-${{ matrix.platform }}-${{ matrix.arch }}" }

      # bash on every platform (git-bash on Windows) so one loop covers both the
      # single-target and the two-target (macOS universal) case.
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          for T in ${{ matrix.targets }}; do
            echo "── cargo build --release -p tyutool-bridge --target $T"
            cargo build --release -p tyutool-bridge --target "$T"
          done

      # Proves `+crt-static` from the workspace `.cargo/config.toml` actually
      # took effect on a real MSVC build: tests/build_config.rs has a
      # cfg-gated test asserting `cfg!(target_feature = "crt-static")`, and an
      # MSVC target is the only place it can run. The ubuntu `check` job can
      # only assert the config file's *content* — without this step a silently
      # non-applying flag would ship a VCRUNTIME140.dll-dependent exe again.
      - name: Verify static CRT (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cargo test -p tyutool-bridge --target x86_64-pc-windows-msvc --test build_config

      # ── Stage the binary into out/ ──
      - name: Stage binary (macOS universal)
        if: matrix.arch == 'universal'
        run: |
          set -euo pipefail
          mkdir -p out
          lipo -create -output out/tyutool-bridge \
            target/aarch64-apple-darwin/release/tyutool-bridge \
            target/x86_64-apple-darwin/release/tyutool-bridge
          lipo -info out/tyutool-bridge
          chmod +x out/tyutool-bridge

      - name: Stage binary (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p out
          cp "target/${{ matrix.target }}/release/tyutool-bridge" out/
          chmod +x out/tyutool-bridge

      - name: Stage binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/tyutool-bridge.exe" out/

      # Cheap smoke test. `--help` is handled before logging setup and before
      # any tray/GTK initialisation (see main.rs), so it is safe on a headless
      # runner with no DISPLAY.
      # The exit code alone is not enough any more: the release binary is linked
      # as a GUI-subsystem app on Windows, and writes to a NULL standard handle
      # *succeed* (`std` maps ERROR_INVALID_HANDLE to `Ok`), so a `--help` that
      # printed nothing would still exit 0.
      #
      # What this step does and does not cover, precisely: because the runner
      # shell always redirects the child's stdout into a pipe, the handle here is
      # never NULL — inherited handles are independent of the subsystem. So this
      # asserts the GUI-subsystem exe still writes to a *redirected* stdout (the
      # supervisor / `> out.txt` case). The NULL-handle case only happens in an
      # interactive terminal, where `proc::attach_parent_console` is what saves
      # it, and that remains a real-machine check — CI structurally cannot see it.
      - name: Smoke test (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          out=$(./out/tyutool-bridge --help)
          printf '%s\n' "$out"
          case "$out" in
            *--headless*) ;;
            *) echo "::error::--help produced no usable output"; exit 1 ;;
          esac

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = & ./out/tyutool-bridge.exe --help | Out-String
          Write-Host $out
          if ($out -notmatch '--headless') {
            Write-Host "::error::--help produced no usable output (GUI subsystem swallowed stdout?)"
            exit 1
          }

      # ── Package: bare archive ──
      #
      # Kept *alongside* the installers below, not replaced by them. The two have
      # different consumers: an installer puts the binary somewhere a human can
      # double-click it (inside `.app/Contents/MacOS/` on macOS), while CI jobs,
      # supervisors and `--headless` smoke scripts want one file at a predictable
      # path. Dropping the archive would break the latter to serve the former.
      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -czf "dist/tyutool-bridge_${{ matrix.platform }}_${{ matrix.arch }}_${{ needs.prepare.outputs.file_label }}.tar.gz" \
              -C out tyutool-bridge

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "out/tyutool-bridge.exe" `
            -DestinationPath "dist/tyutool-bridge_${{ matrix.platform }}_${{ matrix.arch }}_${{ needs.prepare.outputs.file_label }}.zip"

      # ── Package: installers ──
      #
      # cargo-packager only packages, never builds, so it has to be pointed at an
      # already-built binary.
      #
      # ⚠ **`--binaries-dir` cannot do that.** In 0.11.8 the flag is declared on the
      # CLI struct and then never read — `config.binaries_dir` is only ever set from
      # the config file or from the computed default, so passing it is silently
      # ignored. (First attempt did exactly that and failed with
      # `Failed to copy … target/release/tyutool-bridge: No such file or directory`.)
      # The only reliable lever is that default:
      #     `target_directory [/ <--target triple>] / <profile>`
      # so the binary must be sitting exactly there. Hence the two cases below.
      #
      # `--out-dir` *is* honoured, and stays absolute because the tool
      # `set_current_dir`s into the directory of the Cargo.toml holding the config
      # (`crates/tyutool-bridge/`) before packaging — anything relative would
      # resolve from there rather than the workspace root.
      #
      # Every external tool it needs (NSIS, `create-dmg`) is downloaded and
      # SHA-checked at run time, so there is nothing to pre-install on the
      # runners. One CI-specific quirk it already handles by itself: `create-dmg`
      # hanging on a headless runner (it passes `--skip-jenkins` when `CI` is set).
      #
      # `cargo install`, not `taiki-e/install-action` — that action's tool list
      # does not include cargo-packager (checked against its TOOLS.md), so asking
      # it for one fails the job outright. `--locked` pins the tool's own
      # dependency tree so a fresh transitive release cannot break packaging on a
      # day nobody touched this repo; the version is pinned for the same reason.
      - name: Install cargo-packager
        shell: bash
        run: cargo install cargo-packager --locked --version 0.11.8


      # rpm 走单独的工具：cargo-packager 0.11.8 不支持 rpm（只有
      # app/appimage/deb/dmg/nsis/pacman/wix）。配置在 crates/tyutool-bridge/Cargo.toml
      # 的 [package.metadata.generate-rpm]（含 udev 规则与 Fedora 系依赖名）。
      - name: Install cargo-generate-rpm (Linux only)
        if: runner.os == 'Linux'
        run: cargo install cargo-generate-rpm --locked --version 0.21.0
      # ── macOS 代码签名与公证（S46 接上）───────────────────────────────────
      #
      # 与 release.yml **共用同一套 secrets**，不新增 secret 名：上游那边已经配好
      # APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_ID / APPLE_PASSWORD /
      # APPLE_TEAM_ID，bridge 是同一个产品的另一个可执行文件，用同一张 Developer ID
      # 证书签是正确的（同 team、同 identity），也免得上游再维护第二套凭据。
      #
      # ⚠ 与 release.yml 的写法不同，这里**不需要**手工建临时 keychain、导入 p12、
      # 再 `security find-identity` 捞身份：cargo-packager 自己就消费
      # APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD（源码 codesign/macos.rs 的
      # `packager_keychain` 分支），公证也内建（notarytool）。照抄 release.yml 那段
      # 反而会和它自己建的 keychain 打架。
      #
      # ⚠ 但**签不签**由配置里的 `signing_identity` 是否存在决定
      # （`if let Some(identity) = config.macos().and_then(|m| m.signing_identity...)`，
      # package/app/mod.rs:146）——环境变量里**没有** APPLE_SIGNING_IDENTITY 这一项，
      # 而 `--config` 是**整体替换**而非合并（cli/config.rs:231 的 match 直接返回，
      # 根本不去读 Cargo.toml 元数据），用它注入会把打包配置全丢掉。
      # 所以只能在构建时把这一行写进 Cargo.toml。
      #
      # ⚠ 这也正好是 fork 的降级开关：secret 为空 → 不写这一行 → signing_identity
      # 缺席 → 整段签名被跳过（不是报错）。fork 里照常产出未签名包，合入上游后
      # 自动开始签名+公证，**不需要改任何代码**。
      # ⚠ 「有没有证书」的判断放在**脚本里**而不是 step 的 `if:`。
      # step 级 `if` 能否读到该 step 自己 `env:` 里的值，是 GitHub Actions 里一个有名的
      # 歧义点（`secrets` 上下文在 step 级 `if` 里则明确不可用）。赌错的两种后果都很糟：
      # 恒 false → 上游永远不签名却没人发现；恒 true → fork 每次构建都在这一步炸。
      # 写在脚本里是无歧义的，代价只是多跑一个空步骤。
      - name: Enable macOS signing (only when the certificate secret exists)
        if: runner.os == 'macOS'
        shell: bash
        env:
          # 只要 APPLE_CERTIFICATE 这一个——本步骤只判断「有没有证书」，不做签名本身。
          # 多递一个 secret 就是多一份无谓的暴露面（二次 CR）。真正签名/公证用的那 5 个
          # 在下面 Build installers 那步。
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "No APPLE_CERTIFICATE secret (fork build) — skipping signing; packages will be unsigned."
            exit 0
          fi
          MANIFEST=crates/tyutool-bridge/Cargo.toml
          # 身份取「Developer ID Application: <team>」的通配形式：cargo-packager 会把它
          # 交给 codesign 做前缀匹配，无需把带 TEAM_ID 的全名硬编码进仓库。
          IDENTITY="Developer ID Application"
          # 追加到 [package.metadata.packager.macos] 段末尾。用 awk 定位段落而不是
          # 盲目 append：append 到文件末尾会落进后面的 [package.metadata.generate-rpm]，
          # rpm 那段不认这个键，会直接报 unknown field。
          awk -v id="$IDENTITY" '
            /^\[package\.metadata\.packager\.macos\]/ { print; print "signing_identity = \"" id "\""; next }
            { print }
          ' "$MANIFEST" > "$MANIFEST.tmp" && mv "$MANIFEST.tmp" "$MANIFEST"
          # 断言插入确实发生：段头存在但形态意外时，awk 会安静地什么都不做，
          # 而后续打包一样"成功"、只是没签名——那正是最难发现的一类失败（二次 CR）。
          grep -q '^signing_identity' "$MANIFEST" \
            || { echo "::error::signing_identity was not injected into $MANIFEST"; exit 1; }
          grep -A 2 '^\[package\.metadata\.packager\.macos\]' "$MANIFEST"
          echo "macOS signing enabled"

      - name: Build installers
        shell: bash
        env:
          # 签名与公证凭据：cargo-packager 直接消费这几个变量（见上一步的说明）。
          # 空值时它不会尝试签名/公证——降级由 signing_identity 缺席保证，这里只是把
          # 凭据递进去。⚠ 绝不要把这些值 echo 出来或写进日志。
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # macOS: dmg. Windows: nsis (the installer with shortcuts + an
          # uninstall entry) — not wix, which produces an .msi with neither.
          # Linux: deb only from this tool; rpm comes from cargo-generate-rpm
          # below. The two together cover the distro families we ship to.
          #
          # ⚠ AppImage was dropped deliberately (真机现场：Ubuntu LTS 上打出来的包
          # 用户跑不起来). It is not a packaging bug we can fix from here — an
          # AppImage needs libfuse2 on the *user's* machine, which Ubuntu 22.04+
          # no longer installs by default, so the file downloads fine and then
          # fails to launch with an error that says nothing about FUSE. A format
          # whose failure mode is "nothing happens" is worse than not offering it:
          # deb and rpm install through the system package manager, which reports
          # missing dependencies by name.
          FORMATS: >-
            ${{ runner.os == 'macOS' && 'dmg'
             || runner.os == 'Windows' && 'nsis'
             || 'deb' }}
          # Empty on the macOS row (it builds two triples and merges them), set on
          # Linux/Windows. Drives which of the two cases below applies.
          PACKAGER_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          args=(--release --packages tyutool-bridge --formats "$FORMATS")

          if [ -n "$PACKAGER_TARGET" ]; then
            # Single-triple platforms: `cargo build --target $T` already left the
            # binary in `target/$T/release/`, which is exactly where passing
            # `--target` makes the packager look. Nothing to copy.
            args+=(--target "$PACKAGER_TARGET")
          else
            # macOS universal: no triple owns the `lipo`-merged binary, so place it
            # where the *no-target* default looks (`target/release/`). Cargo never
            # writes there on this row — both real builds went to
            # `target/<triple>/release/` — so this cannot clobber a build output.
            mkdir -p target/release
            cp out/tyutool-bridge target/release/tyutool-bridge
            lipo -info target/release/tyutool-bridge
          fi

          cargo packager "${args[@]}" \
            --out-dir "$GITHUB_WORKSPACE/installers" \
            --verbose

          # rpm：cargo-packager 打不了，单独出一发放进同一个 out-dir，后续收集/上传一视同仁。
          # --target 让它去 target/<triple>/release/ 找二进制（与上面 cargo build 的落点一致）；
          # 产物默认写 target/generate-rpm/，拷过去即可。
          if [ "$RUNNER_OS" = "Linux" ]; then
            cargo generate-rpm -p crates/tyutool-bridge --target "$PACKAGER_TARGET"
            cp target/"$PACKAGER_TARGET"/generate-rpm/*.rpm "$GITHUB_WORKSPACE/installers/"
          fi

          echo "── Installers ──────────────────────────────────"
          ls -lh "$GITHUB_WORKSPACE/installers"

      # Renamed into the same `<platform>_<arch>_<label>` scheme as the archives so
      # a release page lists one coherent set of names rather than a mix of ours
      # and the packager's own (which are inconsistent between formats: `.dmg` and
      # `-setup.exe` use the product name, `.deb` the binary name).
      - name: Collect installers into dist
        shell: bash
        run: |
          set -euo pipefail
          label="${{ matrix.platform }}_${{ matrix.arch }}_${{ needs.prepare.outputs.file_label }}"
          shopt -s nullglob
          found=0
          for f in "$GITHUB_WORKSPACE"/installers/*.dmg \
                   "$GITHUB_WORKSPACE"/installers/*setup.exe \
                   "$GITHUB_WORKSPACE"/installers/*.deb \
                   "$GITHUB_WORKSPACE"/installers/*.rpm; do
            ext="${f##*.}"
            # `*-setup.exe` keeps the "this is an installer, not the app" signal
            # that a bare `.exe` next to a `.zip` of the same name would lose.
            case "$f" in *setup.exe) name="tyutool-bridge_${label}-setup.exe" ;;
                         *)           name="tyutool-bridge_${label}.${ext}" ;; esac
            cp "$f" "dist/$name"
            found=$((found + 1))
          done
          # Silence here would mean shipping a release with no installer in it and
          # nobody noticing until a user clicked the download link.
          if [ "$found" -eq 0 ]; then
            echo "::error::cargo packager produced no installer for ${{ matrix.platform }}"
            exit 1
          fi

          # Linux 要的是**两件套**（deb / rpm）：只查 found>0 的话，rpm 那一发挂了而
          # deb 成功时 found 仍是 1，会静默发出一个缺包的 release——正是「没人发现，
          # 直到用户点了下载链接」那类事故。逐个点名，缺哪个报哪个。
          if [ "$RUNNER_OS" = "Linux" ]; then
            # 用数组判空而不是 compgen/ls：脚本开头开了 nullglob，无匹配时通配符会展开成
            # **空**，`ls dist/*.rpm` 会退化成无参数 ls（列当前目录、返回 0）而漏判
            missing=""
            for ext in deb rpm; do
              hits=(dist/*."${ext}")
              [ "${#hits[@]}" -gt 0 ] || missing="${missing} ${ext}"
            done
            if [ -n "$missing" ]; then
              echo "::error::Linux installers missing:${missing} (expected deb + rpm)"
              exit 1
            fi
          fi
          ls -lh dist/

      - uses: actions/upload-artifact@v7
        with:
          name: tyutool-bridge_${{ matrix.platform }}_${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  # ── GitHub Release (bridge-v* tags only) ───────────────────────────────────
  # No `scripts/changelog-section.ts` / `generate-manifest.ts` / updater manifest
  # here: those belong to the upstream `v*.*.*` release line. The bridge has no
  # auto-updater, so the release body is written inline.
  release:
    name: Create Release
    needs: [prepare, build]
    if: needs.prepare.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts/
          pattern: "tyutool-bridge_*"
          merge-multiple: false

      - name: Collect release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts/ -type f -exec cp {} release-assets/ \;
          echo "── Release assets ──────────────────────────────"
          ls -lh release-assets/

      - name: Write release body
        env:
          # 本次构建到底签没签，由「secret 在不在」决定（与 build job 里那道开关同源）。
          # release 页面的说明必须跟着分岔——签了还教用户去 xattr 去隔离属性，是假话。
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          cat > release-body.md <<'EOF'
          `tyutool-bridge` — resident local WebSocket flash helper with a system tray.

          ## Install (pick this)

          | Platform | Asset | What it does |
          |---|---|---|
          | macOS (Intel + Apple Silicon) | `tyutool-bridge_macos_universal_*.dmg` | Drag **Cobuilder Bridge** into Applications. Runs in the menu bar only — no Dock icon. |
          | Windows x86_64 | `tyutool-bridge_windows_x86_64_*-setup.exe` | Per-user install (no admin needed): Start-menu + desktop shortcuts, and an entry in Settings ▸ Apps for uninstalling. |
          | Linux x86_64 (Debian/Ubuntu) | `tyutool-bridge_linux_x86_64_*.deb` | `sudo apt install ./…deb` — adds a desktop entry and the serial udev rules. |
          | Linux x86_64 (Fedora/RHEL/openSUSE) | `tyutool-bridge_linux_x86_64_*.rpm` | `sudo dnf install ./…rpm` (or `zypper`) — same contents as the deb. |

          Autostart at login is **on by default** and can be turned off from the
          tray menu ("开机自启" / "Start at login").

          ## Bare binaries (for CI and supervisors)

          The archives below hold the single executable, for running
          `--headless` from a script where a `.app`/installed path is in the way.

          | Platform | Asset |
          |---|---|
          | macOS (universal) | `tyutool-bridge_macos_universal_*.tar.gz` |
          | Windows x86_64 | `tyutool-bridge_windows_x86_64_*.zip` |
          | Linux x86_64 (glibc) | `tyutool-bridge_linux_x86_64_*.tar.gz` |

          EOF

          # ── 签名相关的说明按实际情况追加，别把两种情形写成一种 ──
          if [ -n "${APPLE_CERTIFICATE:-}" ]; then
            cat >> release-body.md <<'EOF'

          ## Signing

          macOS builds are **code-signed with a Developer ID certificate and
          notarized** — drag into Applications and launch; no right-click-Open and
          no `xattr` dance.

          - **Windows** — the installer is **not** signed yet, so SmartScreen may
            still warn: "More info" → "Run anyway".
          - **Linux** — no OS-level signature gate.
          EOF
          else
            cat >> release-body.md <<'EOF'

          ## ⚠ Unsigned builds

          This build was produced **without signing credentials** (a fork does not
          inherit the upstream signing secrets), so nothing here is code-signed or
          notarized. An unsigned `.dmg` is if anything *harder* to get past
          Gatekeeper than a loose binary, because the block applies to the whole
          `.app`.

          - **macOS** — after dragging it in, the first launch is refused. Either
            right-click the app → Open (then confirm), or:
            ```
            xattr -dr com.apple.quarantine "/Applications/Cobuilder Bridge.app"
            ```
          - **Windows** — SmartScreen will warn about the installer; choose
            "More info" → "Run anyway".
          - **Linux** — no additional step needed.

          Intended for internal integration testing, not public distribution.
          EOF
          fi

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: tyutool-bridge ${{ github.ref_name }}
          body_path: release-body.md
          files: release-assets/*
