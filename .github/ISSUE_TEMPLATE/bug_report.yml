name: 🐞 Bug 报告 / Bug report
description: 反馈一个问题，并附上日志帮助我们定位 / Report a problem and attach logs to help us debug
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量填全下面的信息 —— 尤其是**日志**，它能极大帮助我们定位问题。
        Thanks for the report! Please fill in as much as you can — the **logs** especially help us track things down.
  - type: input
    id: version
    attributes:
      label: 版本 / Version
      description: 见 设置 → 关于 / See Settings → About
      placeholder: "e.g. 3.0.11"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 使用方式 / Platform
      options:
        - 桌面应用 GUI / Desktop app (GUI)
        - 命令行 CLI / Command line (CLI)
        - 浏览器 + Bridge 常驻进程 / Browser + Bridge helper
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 操作系统 / Operating system
      placeholder: "e.g. Windows 11 / macOS 14 / Ubuntu 24.04"
    validations:
      required: true
  - type: input
    id: chip
    attributes:
      label: 芯片型号 / Chip
      description: 如适用 / If applicable
      placeholder: "e.g. BK7231N, T5AI"
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 一步步说明如何触发这个问题 / How can we trigger the problem, step by step?
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: 期望结果与实际结果 / Expected vs. actual
      description: 你期望发生什么？实际发生了什么？/ What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / Logs
      description: >
        强烈建议附上日志：把导出的 zip 直接拖到此输入框即可上传。
        GUI：设置 → 应用日志 → 导出日志并反馈；
        CLI：日志路径见启动时打印的 `log:` 行（每次运行生成独立文件，如
        `~/.local/share/com.tyutool.cli/logs/tyutool-<时间戳>.log`；macOS 为
        `~/Library/Logs/com.tyutool.cli/`，Windows 为 `%LOCALAPPDATA%\com.tyutool.cli\logs\`）。
        Bridge：无导出入口，请手动附上日志文件 —— 路径同样见启动时打印的 `bridge session log:` 行
        （每次启动生成独立文件，如 `~/.local/share/com.tyutool.bridge/logs/tyutool-bridge-<时间戳>.log`；
        macOS 为 `~/Library/Logs/com.tyutool.bridge/`，Windows 为 `%LOCALAPPDATA%\com.tyutool.bridge\logs\`）。
        ⚠ Bridge 的授权文件 `{配置目录}/com.tyutool.bridge/grants.json` 里存的是**凭证**，
        排查问题不需要它，**请勿附带**（macOS `~/Library/Application Support/com.tyutool.bridge/`，
        Linux `~/.config/com.tyutool.bridge/`，Windows `%APPDATA%\com.tyutool.bridge\`）。
        （旧版本的 CLI/Bridge 日志在 `{数据目录}/tyutool/` 与 `{数据目录}/tyutool-bridge/`，仍可附上。）
        Strongly recommended — drag the exported log zip into this box to upload it.
        GUI: Settings → Application Logs → Export Logs & Report Issue.
        CLI: the log path is printed in the startup banner (`log:` line).
        Bridge: no export UI — attach the file by hand; its path is printed at startup
        (`bridge session log:` line), one file per launch under the platform log location.
        ⚠ Do NOT attach the Bridge grant file `{config dir}/com.tyutool.bridge/grants.json` —
        it holds a credential and is never needed to debug an issue.
