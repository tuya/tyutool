[package]
name = "tyutool-serve"
version.workspace = true
edition = "2021"
description = "tyutool WebSocket serve layer — shared by tyutool-cli serve and future hosts"

[dependencies]
anyhow = "1"
base64 = "0.23"
futures-util = "0.3"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30"
tyutool-core = { path = "../tyutool-core" }

[dev-dependencies]
tyutool-core = { path = "../tyutool-core", features = ["mock-chip"] }
