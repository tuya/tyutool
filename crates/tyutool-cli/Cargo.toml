[package]
name = "tyutool-cli"
version.workspace = true
edition = "2021"
description = "tyutool CLI — shared tyutool-core flash API (no Tauri)"

[[bin]]
name = "tyutool_cli"
path = "src/main.rs"

[dependencies]
fern = "0.7"
chrono = { version = "0.4", features = ["clock"] }
dirs = "6"
log = "0.4"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
ctrlc = "3"
tyutool-core = { path = "../tyutool-core", features = ["zip", "download"] }
tyutool-serve = { path = "../tyutool-serve" }
reqwest = { version = "0.12", features = ["rustls-tls", "blocking", "json"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", features = [] }
hex = "0.4"
self-replace = "1"
flate2 = "1"
tar = "0.4"
zip = "2"
semver = { version = "1", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
indicatif = "0.18"
console = "0.16"

[dev-dependencies]
tempfile = "3"
