[package]
name = "tyutool-core"
version = "3.0.13"
edition = "2021"
description = "Shared flash/erase plugin registry and serial helpers for tyutool CLI and GUI"

[dev-dependencies]
serde_json = "1"

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "1"
serialport = { version = "4", features = ["usbportinfo-interface"] }
crc32fast = "1"
log = "0.4"
# espflash fork: extended FlashDefl timeouts for large raw BIN (e.g. ESP32-P4).
# https://github.com/shiliu-yang/espflash — branch `tyutool-extended-timeouts`
espflash = { git = "https://github.com/shiliu-yang/espflash", branch = "tyutool-extended-timeouts", default-features = false, features = ["serialport"] }
md-5 = "0.10"
