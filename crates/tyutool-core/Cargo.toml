[package]
name = "tyutool-core"
version.workspace = true
edition = "2021"
description = "Shared flash/erase plugin registry and serial helpers for tyutool CLI and GUI"

[features]
# Enables libudev-backed port enumeration on Linux (GUI / glibc builds only).
# CLI musl builds and CI must leave this disabled; the Tauri shell enables it.
libudev = ["serialport/libudev"]
# Enables zip-based log export/archive bundling (write_logs_zip /
# gather_and_write_logs_zip). The GUI must enable it (export-for-report and
# archive-batch both zip session logs), and so must the CLI (`tyutool logs
# export`); tyutool-serve and tyutool-bridge must leave it disabled so they
# don't link the zip crate for a capability they don't use.
zip = ["dep:zip"]
# Enables the Excel-backed batch-auth row allocator (`batch_auth`), which
# reads and writes the operator's .xlsx credential sheet. The GUI must enable
# it (the batch-auth toolbox tool is built on it); tyutool-cli, tyutool-serve
# and tyutool-bridge must leave it disabled so they don't link two spreadsheet
# crates for a capability they don't drive.
excel = ["dep:calamine", "dep:rust_xlsxwriter"]
# Enables ts-rs-derived TypeScript bindings for the FlashJob family
# (`FlashJob` / `FlashMode` / `FlashSegment` / `AuthStorage`), written to
# `src/bindings/` by `cargo test -p tyutool-core --features ts-rs`. Only
# needed to (re)generate those files — tyutool-cli / tyutool-serve /
# tyutool-bridge never derive `TS` and must leave this disabled so they don't
# link the ts-rs macro crate for a capability they don't use.
ts-rs = ["dep:ts-rs"]
# Enables the scripted mock chip plugin (`plugins::mock::MockPlugin`), which
# answers a flash job without ever touching a serial port, so `run_job`'s
# orchestration can be driven in tests. It sits behind a feature rather than
# `#[cfg(test)]` because a `#[cfg(test)]` item exists only while compiling
# *this* crate's own tests, and the tyutool-serve / src-tauri suites are
# separate compilation units that could never see it.
#
# WARNING: it also registers a `MOCK` chip in the **default** registry, so any
# binary built with it would offer users a device that only pretends to flash.
# It must never ship. Turn it on from a `cargo test --features` command line and
# nowhere else — in particular never add it to a consumer's
# `tyutool-core = { features = [..] }`. Two guards enforce that and both must
# stay: the block at the top of src/lib.rs (a release build carrying it fails to
# compile) and tests/shipped_crates_exclude_mock_chip.rs (no shipped manifest
# may name it).
mock-chip = []
# Enables downloading the on-demand RAM loader assets (`ram_loader`) over HTTPS when
# they are not already cached. Every *shipped* binary that can flash must enable it
# (tyutool-cli, src-tauri, tyutool-bridge) — LN882H and GD32VW553 cannot be flashed
# without their loader, and nothing embeds it any more. Leaving it off keeps the crate
# HTTP-free and restricts `ram_loader::resolve` to the local cache and
# `TYUTOOL_RAM_LOADER_DIR`: that is the right shape for tyutool-serve (a dev shim whose
# only binary, tyutool-cli, already turns the feature on) and for tests.
download = ["dep:reqwest"]
# Enables `RecordIo`, which wraps the live serial transport and appends every
# call to the file named by `TYUTOOL_RECORD_IO`. Used once, by hand, against
# real hardware, to capture the fixture that `ReplayIo` replays in tests.
#
# Test-only for two reasons, and no shipped binary may enable it: it writes raw
# serial traffic to disk, and the authorize flow's traffic carries credentials
# in plaintext (see the credential-isolation contract in AGENTS.md). Recording
# is a deliberate act on a developer's own bench, never something a user's build
# can be talked into. Guarded by
# tests/shipped_crates_exclude_mock_chip.rs alongside `mock-chip`.
record-io = []

[dev-dependencies]
serde_json = "1"
tempfile = "3"
# tests/shipped_crates_exclude_mock_chip.rs parses the workspace's other
# manifests to prove none of them enables `mock-chip`. 0.8 is already in the
# workspace lock (tyutool-bridge's dev-dependencies), so no new version enters
# the tree.
toml = "0.8"

[dependencies]
regex = "1"
# Resolves the user cache directory the RAM loader assets are cached in
# (`ram_loader::cache_dir`). Already in the workspace lock (tyutool-cli, tyutool-bridge),
# so it adds no version to the tree.
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
serialport = { version = "4", default-features = false, features = ["usbportinfo-interface"] }
crc32fast = "1"
log = "0.4"
espflash = { version = "4.3", default-features = false, features = ["serialport"] }
md-5 = "0.10"
# GD32VW553 verifies a write by having the device SHA-256 what it stored; the same
# RustCrypto family as md-5 above, and already in the workspace lock.
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }
ts-rs = { version = "12", optional = true }
# Downloads the RAM loader assets; see the `download` feature. rustls rather than
# native-tls so the CLI's musl builds keep working, matching tyutool-cli's own copy.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"], optional = true }
calamine = { version = "0.26", features = ["dates"], optional = true }
rust_xlsxwriter = { version = "0.79", optional = true }
