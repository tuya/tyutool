[package]
name = "tyutool-bridge"
version = "0.1.0"
edition = "2021"
description = "Cobuilder Bridge — resident local WebSocket flash helper with a tray shell (--headless for CI)"

[[bin]]
name = "tyutool-bridge"
path = "src/main.rs"

[dependencies]
anyhow = "1"
auto-launch = "0.6"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock"] }
dirs = "5"
fern = "0.7"
getrandom = "0.3"
log = "0.4"
muda = "0.17"
tao = "0.34"
tray-icon = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
tyutool-core = { path = "../tyutool-core" }
