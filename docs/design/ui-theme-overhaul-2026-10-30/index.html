<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tyutool · Precision Workbench</title>
    <link rel="stylesheet" href="./preview.css" />
  </head>
  <body>
    <svg class="symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <symbol id="chip" viewBox="0 0 24 24">
        <rect x="6" y="6" width="12" height="12" rx="2" />
        <rect x="9" y="9" width="6" height="6" rx="1" />
        <path d="M9 3v3m6-3v3M9 18v3m6-3v3M3 9h3m-3 6h3m12-6h3m-3 6h3" />
      </symbol>
      <symbol id="terminal" viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="16" rx="3" />
        <path d="m7 9 3 3-3 3m6 0h4" />
      </symbol>
      <symbol id="box" viewBox="0 0 24 24">
        <rect x="3" y="8" width="18" height="12" rx="2" />
        <path d="M8 8V5a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v3M3 12h18m-11 0v3h4v-3" />
      </symbol>
      <symbol id="sliders" viewBox="0 0 24 24">
        <path d="M4 7h5m4 0h7M4 17h9m4 0h3" />
        <circle cx="11" cy="7" r="2" />
        <circle cx="15" cy="17" r="2" />
      </symbol>
      <symbol id="chevron" viewBox="0 0 24 24">
        <path d="m9 5 7 7-7 7" />
      </symbol>
      <symbol id="down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" /></symbol>
      <symbol id="file" viewBox="0 0 24 24">
        <path
          d="M13 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10L13 3Z"
        />
        <path d="M13 3v7h7M8 15h8m-8 3h5" />
      </symbol>
      <symbol id="arrow" viewBox="0 0 24 24">
        <path d="M4 12h16m-6-6 6 6-6 6" />
      </symbol>
      <symbol id="check" viewBox="0 0 24 24">
        <path d="m5 12 4 4L19 6" />
      </symbol>
      <symbol id="refresh" viewBox="0 0 24 24">
        <path d="M20 7v5h-5M4 17v-5h5" />
        <path d="M6 7a7 7 0 0 1 12-1l2 6M4 12l2 6a7 7 0 0 0 12-1" />
      </symbol>
      <symbol id="history" viewBox="0 0 24 24">
        <path d="M3 4v6h6M3 10a9 9 0 1 1 1 7" />
        <path d="M12 7v5l3 2" />
      </symbol>
      <symbol id="search" viewBox="0 0 24 24">
        <circle cx="10.5" cy="10.5" r="6.5" />
        <path d="m16 16 5 5" />
      </symbol>
      <symbol id="close" viewBox="0 0 24 24">
        <path d="m6 6 12 12M6 18 18 6" />
      </symbol>
      <symbol id="pause" viewBox="0 0 24 24">
        <path d="M8 5v14M16 5v14" />
      </symbol>
      <symbol id="play" viewBox="0 0 24 24">
        <path d="m8 4 12 8-12 8V4Z" />
      </symbol>
      <symbol id="star" viewBox="0 0 24 24">
        <path
          d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9L12 3Z"
        />
      </symbol>
      <symbol id="sun" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4" />
        <path
          d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"
        />
      </symbol>
      <symbol id="moon" viewBox="0 0 24 24">
        <path d="M20 15.5A9 9 0 0 1 8.5 4a9 9 0 1 0 11.5 11.5Z" />
      </symbol>
    </svg>
    <div class="proposal-bar">
      <span
        ><span class="proposal-dot"></span
        ><span data-i18n="concept">视觉概念预览</span
        ><span class="proposal-sep">/</span
        ><span data-i18n="sample">全部为演示数据</span></span
      >
      <div class="proposal-controls">
        <button data-action="locale" class="plain" aria-label="Switch language">
          EN
        </button>
        <div class="segment" aria-label="Preview theme">
          <button data-theme-choice="light" aria-pressed="false">
            <svg><use href="#sun" /></svg><span data-i18n="light">纸白</span>
          </button>
          <button data-theme-choice="dark" aria-pressed="true">
            <svg><use href="#moon" /></svg><span data-i18n="dark">石墨</span>
          </button>
        </div>
      </div>
    </div>
    <div class="workbench">
      <aside class="rail" aria-label="Main navigation">
        <div class="brand">
          <span class="brand-mark"
            ><svg><use href="#chip" /></svg></span
          ><span><b>tyutool</b><small>PRECISION WORKBENCH</small></span>
        </div>
        <div class="rail-caption" data-i18n="workspace">工作空间</div>
        <nav>
          <button data-page="flash" aria-current="page">
            <svg><use href="#chip" /></svg
            ><span data-i18n="flash">固件工具</span>
          </button>
          <button data-page="serial">
            <svg><use href="#terminal" /></svg
            ><span data-i18n="serial">串口调试</span>
          </button>
          <button data-page="toolbox">
            <svg><use href="#box" /></svg
            ><span data-i18n="toolbox">工具箱</span>
          </button>
          <button data-page="settings">
            <svg><use href="#sliders" /></svg
            ><span data-i18n="settings">设置</span>
          </button>
        </nav>
        <div class="rail-bottom">
          <div class="rail-device">
            <span class="status-dot"></span
            ><span data-i18n="sampleDevice">演示设备</span
            ><span class="mono">COM6</span>
          </div>
          <div class="rail-version">
            <span>tyutool</span><span class="mono">3.2.10</span>
          </div>
        </div>
      </aside>
      <div class="workspace">
        <header class="workspace-bar">
          <span id="breadcrumb"></span
          ><span class="workspace-signature">PRECISION / 01</span>
        </header>
        <main id="content" tabindex="-1"></main>
        <footer class="statusbar">
          <span
            ><span class="status-dot"></span
            ><span data-i18n="ready">演示工作台就绪</span></span
          ><span class="mono"
            >UTF-8<span class="status-divider">/</span>115200<span
              class="status-divider"
              >/</span
            >8 · N · 1</span
          >
        </footer>
      </div>
    </div>
    <aside
      id="history-panel"
      class="inspector"
      aria-label="Command history"
      hidden
    ></aside>
    <dialog id="confirm-dialog" aria-labelledby="confirm-title"></dialog>
    <div id="toast" class="toast" role="status" hidden></div>
    <script src="./preview.js"></script>
  </body>
</html>
