[package]
name = "tyutool_gui"
version.workspace = true
description = "tyutool — Tauri shell for tyutool-core (firmware / serial tooling)"
authors = ["tyutool contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tyutool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tyutool-core = { path = "../crates/tyutool-core", features = ["libudev", "zip", "excel", "download"] }
tauri-plugin-log = "2"
log = "0.4"
sha2 = "0.10"
chrono = "0.4"

[dev-dependencies]
tempfile = "3"
# `tauri::test::mock_builder` — a headless mock runtime, so the flash commands can
# be driven without a WebView. `tauri` is already a normal dependency; this only
# turns on its `test` feature for the test build.
tauri = { version = "2", features = ["test"] }
# The `MOCK` fake device, so a flash job can run with no hardware attached.
# A dev-dependency deliberately: `cargo build --release` (and `tauri build`)
# never compiles one, so the fake chip cannot reach the GUI bundle. See that
# feature's comment in crates/tyutool-core/Cargo.toml for the two guards, and
# crates/tyutool-core/tests/shipped_crates_exclude_mock_chip.rs for the check.
tyutool-core = { path = "../crates/tyutool-core", features = ["mock-chip"] }
